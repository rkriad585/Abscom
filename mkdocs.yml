site_name: Abscom
site_description: A C11 library of reusable data structures and a Python-inspired dynamic runtime
site_url: https://rkriad585.github.io/Abscom/
repo_url: https://github.com/rkriad585/Abscom
repo_name: rkriad585/Abscom
edit_uri: blob/main/docs/
copyright: Copyright &copy; 2026 rkriad585. Released under the MIT License.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra:
  generator: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Core Library:
      - Common Macros: common-macros.md
      - Dynamic Arrays: dynamic-arrays.md
      - Strings: strings.md
      - Hashing: hashing.md
      - Hash Maps: hash-maps.md
      - Time: time.md
      - File I/O: file-io.md
  - Runtime:
      - Lifecycle: lifecycle.md
      - Literals and Constructors: literals-and-constructors.md
      - Types and Conversions: types-and-conversions.md
      - Lists and Ranges: lists-and-ranges.md
      - Loops: loops.md
      - Dictionaries: dictionaries.md
      - Sets: sets.md
      - String Methods: string-methods.md
      - Formatting and Printing: formatting.md
      - JSON: json.md
      - Functional Helpers: functional-helpers.md
      - Random Utilities: random-utilities.md
      - Math and Aggregates: math-and-aggregates.md
      - Truthiness and Logic: truthiness-and-logic.md
      - Sequences and Sorting: sequences-and-sorting.md
      - Object-Oriented Light: oop-lite.md
      - File Handles: runtime-files.md
      - System and Processes: system.md
      - Error Handling: error-handling.md
  - Language Features:
      - Exceptions and Context Managers: exceptions.md
      - Regular Expressions: regex.md
      - Date and Time: datetime.md
      - Generators: generators.md
      - Encoding and Environment: encoding-and-env.md
  - Scientific:
      - Matrices, Statistics, and More: scientific.md
  - Framework:
