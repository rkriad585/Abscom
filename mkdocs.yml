site_name: Abscom
site_description: A C11 library of reusable data structures and a Python-inspired dynamic runtime (ac_py)
site_url: https://rkriad585.github.io/Abscom/
repo_url: https://github.com/rkriad585/Abscom
repo_name: rkriad585/Abscom
edit_uri: blob/main/docs/
copyright: Copyright &copy; 2026 rkriad585. Released under the MIT License.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra:
  generator: false

nav:
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Usage: usage.md
  - API Reference: api.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Development: development.md
  - Deployment: deployment.md
  - Screenshots: screenshots.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
